name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the bundle
        run: |
          for file in manifest.json background.js content.js harvest.js icons/128.png; do
            test -s "dist/$file" || { echo "dist/$file is missing"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: tempo-dist
          path: dist/
          retention-days: 14
