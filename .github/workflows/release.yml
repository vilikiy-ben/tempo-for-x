name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Tag matches manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, manifest $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: cd dist && zip -r -q -X "../tempo-for-x-$VERSION.zip" .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "tempo-for-x-$VERSION.zip" --title "Tempo $VERSION" --generate-notes --verify-tag
